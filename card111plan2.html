<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Card 2026 Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #797979;
      color: #f1f1f1;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .dashboard {
      max-width: 420px;
      padding: 20px;
      border-radius: 12px;
      background-color: #2c2c2c;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    .profile img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid #f1f1f1;
    }

    h1, h2 {
      color: #ff9800;
    }

    .membership-card {
      background: #3d3d3d;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      position: relative;
    }

    .fan-image {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #ff9800;
      position: absolute;
      left: 15px;
      top: 15px;
    }

    .membership-card h3,
    .membership-card p {
      margin-left: 110px;
      text-align: left;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .open-button {
      background: #ff9800;
      color: white;
    }

    .close-button {
      background: #555;
      color: white;
    }

    /* MODAL */
    .popup-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0,0,0,0.95);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 10px;
    }

    .popup-content {
      background: #2c2c2c;
      width: 100%;
      max-width: 460px;
      height: 90vh;        /* responsive height */
      max-height: 700px;   /* prevents too tall on large screens */
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .popup-header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #444;
      flex-shrink: 0;
    }

    .popup-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .popup-footer {
      padding: 15px;
      text-align: center;
      border-top: 1px solid #444;
      flex-shrink: 0;
    }

    .popup-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 2px solid #ff9800;
    }
  </style>
</head>

<body>

<div class="dashboard">
  <div class="profile">
    <img src="./assets1/celel.jpg">
    <h2>Membership Card 2026</h2>
  </div>

  <h1>Welcome, Bridget Peterson!</h1>

  <div class="membership-card">
    <img src="./assets1/fan_profile1.jpg" class="fan-image">
    <h3>Your Membership Card</h3>
    <p>Member: Bridget Peterson</p>
    <p>ID: #111</p>
    <p>Status: Active</p>
  </div>

  <button class="open-button" onclick="openPopup()">
    Vacation Meet & Greet 2026
  </button>
</div>

<!-- MODAL -->
<div class="popup-modal" id="modal">
  <div class="popup-content" id="modalContent"></div>
</div>

<script>
function openPopup() {
  document.getElementById("modalContent").innerHTML = `

    <img src="./assets1/private_jet.jpg" class="popup-image">

    <div class="popup-header">
      <h2>Private Meet & Greet Arrival</h2>
    </div>

    <div class="popup-body">

      <p style="text-align:center; line-height:1.7;">
        A private jet has been arranged and has successfully landed in preparation for your
        exclusive meet & greet experience.
      </p>

      <p style="text-align:center; line-height:1.7; margin-top:15px;">
        Every detail has been carefully organized to ensure your journey is smooth,
        comfortable, and truly unforgettable from arrival to the full experience.
      </p>

      <div style="background:#3d3d3d; padding:15px; border-radius:10px; margin:20px 0;">
        <p style="text-align:center;">
          Due to the flight arrangements, logistics, and preparation involved,
          there is a total cost of 
          <strong style="color:#ff9800;">$8,000</strong>.
        </p>

        <p style="text-align:center; margin-top:10px;">
          However, due to the genuine wish to meet you, we are happy to split the cost equally.
        </p>
      </div>

      <p style="text-align:center; font-size:14px; color:#aaa;">
        All preparations are now in place for your exclusive meet & greet experience.
      </p>

    </div>

    <div class="popup-footer">
      <button class="close-button" onclick="closePopup()">Close</button>
    </div>
  `;

  document.getElementById("modal").style.display = "flex";
}

function closePopup() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
